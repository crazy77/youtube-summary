<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>설정</title>
    <meta name="manifest.open_in_tab" content="false" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <label for="template">Gemini에 보낼 프롬프트</label>
      <p class="hint"><code>{url}</code> 자리에 영상 주소가 들어가요. 없으면 맨 끝에 붙어요.</p>
      <textarea id="template" rows="5" spellcheck="false"></textarea>
      <div class="actions">
        <button id="reset" type="button" class="secondary">기본값으로</button>
        <span id="status" role="status"></span>
        <button id="save" type="button">저장</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
